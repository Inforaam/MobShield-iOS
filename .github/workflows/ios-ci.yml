name: iOS CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    # macos-14 was retired on 2026-11-02. Pin Xcode so a change to the
    # image's default does not silently change the toolchain.
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint lint --strict

      - name: Resolve package
        run: swift package resolve

      - name: Build (iOS Simulator)
        run: |
          xcodebuild build \
            -scheme MobShield-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -skipPackagePluginValidation

      - name: Test (iOS Simulator)
        run: |
          xcodebuild test \
            -scheme MobShield-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -skipPackagePluginValidation

      - name: Build sample app (iOS Simulator)
        run: |
          xcodebuild build \
            -project MobShieldSampleApp/MobShieldSampleApp.xcodeproj \
            -scheme MobShieldSampleApp \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""
